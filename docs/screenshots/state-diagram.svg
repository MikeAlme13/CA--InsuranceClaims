<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s_arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="620" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#0f172a">Claim State Diagram — enum ClaimStatus</text>

  <!-- initial pseudostate -->
  <circle cx="410" cy="52" r="10" fill="#1e293b"/>
  <line x1="410" y1="62" x2="410" y2="89" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <text x="428" y="66" font-size="12.5" font-weight="600" fill="#0f172a">submitClaim(amount, evidenceHash)</text>
  <text x="428" y="82" font-size="11" font-style="italic" fill="#64748b">[ policy.active &amp;&amp; amount &lt;= policy.coverage ]</text>

  <!-- Submitted -->
  <rect x="300" y="95" width="220" height="66" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="124" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Submitted</text>
  <text x="410" y="143" font-size="11" fill="#2563eb" text-anchor="middle">awaiting insurer decision</text>

  <!-- Submitted -> Approved (left elbow) -->
  <path d="M 360 161 V 212 H 260 V 243" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <text x="288" y="180" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end">approveClaim(id)</text>
  <text x="288" y="196" font-size="11" font-style="italic" fill="#64748b" text-anchor="end">[ onlyInsurer &amp;&amp; status == Submitted ]</text>

  <!-- Submitted -> Rejected (right elbow) -->
  <path d="M 460 161 V 212 H 570 V 243" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <text x="532" y="180" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">rejectClaim(id)</text>
  <text x="532" y="196" font-size="11" font-style="italic" fill="#64748b" text-anchor="start">[ onlyInsurer ]</text>

  <!-- Approved -->
  <rect x="150" y="249" width="220" height="66" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="260" y="278" font-size="16" font-weight="700" fill="#713f12" text-anchor="middle">Approved</text>
  <text x="260" y="297" font-size="11" fill="#a16207" text-anchor="middle">decision locked, payment pending</text>

  <!-- Rejected -->
  <rect x="460" y="249" width="220" height="66" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="278" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">Rejected</text>
  <text x="570" y="297" font-size="11" fill="#dc2626" text-anchor="middle">terminal — no funds move</text>

  <!-- Approved -> Paid -->
  <line x1="260" y1="315" x2="260" y2="408" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <text x="276" y="340" font-size="12.5" font-weight="600" fill="#0f172a">payClaim(id)</text>
  <text x="276" y="356" font-size="11" font-style="italic" fill="#64748b">[ onlyInsurer &amp;&amp; status == Approved</text>
  <text x="276" y="371" font-size="11" font-style="italic" fill="#64748b">&amp;&amp; address(this).balance &gt;= amount ]</text>
  <text x="276" y="392" font-size="11" font-weight="600" fill="#047857">/ transfer(amount) to claimant</text>

  <!-- Paid -->
  <rect x="150" y="414" width="220" height="66" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="260" y="443" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Paid</text>
  <text x="260" y="462" font-size="11" fill="#059669" text-anchor="middle">terminal — settlement complete</text>

  <!-- Paid -> final -->
  <line x1="260" y1="480" x2="260" y2="518" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <circle cx="260" cy="540" r="13" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="260" cy="540" r="8" fill="#1e293b"/>

  <!-- Rejected -> final -->
  <line x1="570" y1="315" x2="570" y2="518" stroke="#1e293b" stroke-width="1.8" marker-end="url(#s_arw)"/>
  <circle cx="570" cy="540" r="13" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="570" cy="540" r="8" fill="#1e293b"/>

  <!-- note -->
  <rect x="598" y="400" width="200" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="612" y="422" font-size="11.5" font-weight="700" fill="#475569">Re-entrancy guard</text>
  <text x="612" y="440" font-size="10.5" fill="#64748b">status is set to Paid</text>
  <text x="612" y="454" font-size="10.5" fill="#64748b">BEFORE transfer() runs</text>
  <text x="612" y="468" font-size="10.5" fill="#64748b">(checks-effects-</text>
  <text x="612" y="482" font-size="10.5" fill="#64748b">interactions pattern)</text>

  <text x="24" y="586" font-size="10.5" fill="#94a3b8">Every transition is guarded by a require() and emits an event (ClaimSubmitted / ClaimDecided / ClaimPaid).</text>
  <text x="24" y="601" font-size="10.5" fill="#94a3b8">No transition can be reversed, so the state history is itself the immutable audit trail.</text>
</svg>
