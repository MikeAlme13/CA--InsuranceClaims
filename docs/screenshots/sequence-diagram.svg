<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arwp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="870" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">Insurance Claims DApp — Sequence Diagram</text>

  <!-- phase bands -->
  <rect x="20" y="112" width="1160" height="160" rx="6" fill="#f8fafc"/>
  <rect x="20" y="280" width="1160" height="80"  rx="6" fill="#f1f5f9"/>
  <rect x="20" y="368" width="1160" height="152" rx="6" fill="#f8fafc"/>
  <rect x="20" y="528" width="1160" height="198" rx="6" fill="#f1f5f9"/>
  <rect x="20" y="734" width="1160" height="78"  rx="6" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="5 4"/>

  <text x="32" y="132" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.1">1 · SETUP &amp; POLICY CREATION</text>
  <text x="32" y="300" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.1">2 · POLICY ACTIVATION</text>
  <text x="32" y="388" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.1">3 · CLAIM SUBMISSION</text>
  <text x="32" y="548" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.1">4 · DECISION &amp; PAYMENT</text>
  <text x="32" y="754" font-size="11.5" font-weight="700" fill="#c2730c" letter-spacing="1.1">ALT · REJECTION PATH</text>

  <!-- lifelines -->
  <line x1="140"  y1="100" x2="140"  y2="830" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="420"  y1="100" x2="420"  y2="830" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="720"  y1="100" x2="720"  y2="830" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1040" y1="100" x2="1040" y2="830" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- headers -->
  <rect x="48"  y="56" width="184" height="44" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="140" y="76"  font-size="13.5" font-weight="700" fill="#312e81" text-anchor="middle">Policyholder</text>
  <text x="140" y="91"  font-size="10.5" fill="#4f46e5" text-anchor="middle">EOA · secp256k1 key</text>

  <rect x="328" y="56" width="184" height="44" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="420" y="76"  font-size="13.5" font-weight="700" fill="#312e81" text-anchor="middle">Insurer</text>
  <text x="420" y="91"  font-size="10.5" fill="#4f46e5" text-anchor="middle">EOA · contract owner</text>

  <rect x="608" y="56" width="224" height="44" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="720" y="76"  font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">InsuranceClaims.sol</text>
  <text x="720" y="91"  font-size="10.5" fill="#059669" text-anchor="middle">smart contract · holds reserve</text>

  <rect x="948" y="56" width="184" height="44" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1040" y="76" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Ledger</text>
  <text x="1040" y="91" font-size="10.5" fill="#475569" text-anchor="middle">Ganache / Ethereum</text>

  <!-- 1. deploy -->
  <text x="570" y="156" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">1  deploy { value: 10 ether }</text>
  <line x1="420" y1="164" x2="714" y2="164" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="180" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">insurer = msg.sender · claims reserve funded</text>

  <!-- 2. ledger write -->
  <text x="880" y="198" font-size="11.5" fill="#475569" text-anchor="middle">2  contract mined</text>
  <line x1="720" y1="206" x2="1034" y2="206" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- 3. createPolicy -->
  <text x="570" y="234" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">3  createPolicy(holder, premium, coverage)</text>
  <line x1="420" y1="242" x2="714" y2="242" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="258" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">onlyInsurer · active = false</text>

  <!-- 4. emit PolicyCreated -->
  <text x="880" y="252" font-size="11.5" fill="#475569" text-anchor="middle">4  emit PolicyCreated</text>
  <line x1="720" y1="260" x2="1034" y2="260" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- 5. payPremium -->
  <text x="430" y="324" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">5  payPremium() { value: premium }</text>
  <line x1="140" y1="332" x2="714" y2="332" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="430" y="348" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">require(p.holder == msg.sender) · require(msg.value == p.premium)  →  active = true</text>

  <!-- 6. self hash -->
  <path d="M 140 404 H 236 V 430 H 146" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="252" y="412" font-size="12.5" font-weight="600" fill="#0f172a">6  evidenceHash = keccak256(document)</text>
  <text x="252" y="428" font-size="11" font-style="italic" fill="#64748b">document itself stays off-chain (GDPR data minimisation)</text>

  <!-- 7. submitClaim -->
  <text x="430" y="466" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">7  submitClaim(amount, evidenceHash)</text>
  <line x1="140" y1="474" x2="714" y2="474" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="430" y="490" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">require(p.active) · require(amount &lt;= p.coverage)  →  status = Submitted</text>

  <!-- 8. emit ClaimSubmitted -->
  <text x="880" y="504" font-size="11.5" fill="#475569" text-anchor="middle">8  emit ClaimSubmitted</text>
  <line x1="720" y1="512" x2="1034" y2="512" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- 9. approveClaim -->
  <text x="570" y="574" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">9  approveClaim(id)</text>
  <line x1="420" y1="582" x2="714" y2="582" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="598" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">onlyInsurer · require(status == Submitted)  →  Approved</text>

  <!-- 10. emit ClaimDecided -->
  <text x="880" y="592" font-size="11.5" fill="#475569" text-anchor="middle">10  emit ClaimDecided</text>
  <line x1="720" y1="600" x2="1034" y2="600" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- 11. payClaim -->
  <text x="570" y="636" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">11  payClaim(id)</text>
  <line x1="420" y1="644" x2="714" y2="644" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="660" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">require(status == Approved) · require(balance &gt;= amount)</text>

  <!-- 12. transfer (leftward, highlighted) -->
  <text x="430" y="686" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">12  transfer(amount)  —  automatic settlement</text>
  <line x1="720" y1="694" x2="146" y2="694" stroke="#047857" stroke-width="2.2" marker-end="url(#arwp)"/>
  <text x="430" y="710" font-size="11" font-style="italic" fill="#047857" text-anchor="middle">status = Paid is written BEFORE the transfer (checks-effects-interactions, blocks re-entrancy)</text>

  <!-- 13. emit ClaimPaid -->
  <text x="880" y="686" font-size="11.5" fill="#475569" text-anchor="middle">13  emit ClaimPaid</text>
  <line x1="720" y1="716" x2="1034" y2="716" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwd)"/>

  <!-- ALT rejectClaim -->
  <text x="570" y="780" font-size="12.5" font-weight="600" fill="#9a3412" text-anchor="middle">rejectClaim(id)</text>
  <line x1="420" y1="788" x2="714" y2="788" stroke="#9a3412" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="570" y="804" font-size="11" font-style="italic" fill="#c2730c" text-anchor="middle">onlyInsurer · status = Rejected (terminal) · emit ClaimDecided — no funds move</text>

  <text x="24" y="856" font-size="10.5" fill="#94a3b8">Solid arrows = signed transactions (authenticated by ECDSA over secp256k1, surfaced to the EVM as msg.sender).  Dashed arrows = event logs written to the chain (audit trail).</text>
</svg>
